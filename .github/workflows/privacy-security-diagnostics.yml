name: Privacy Exact Readiness Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@v7
        with:
          ref: fix/protected-noindex-main-d34-20260719

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reproduce permanent pre-readiness sequence
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix functions
          npm run build
          npm --prefix functions run build
          npm --prefix functions run typecheck
          npm run check:java
          npm run test:emulators
          npm run security:gate

      - name: Capture readiness output outside repository
        if: always()
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/privacy-readiness-diagnostics"
          mkdir -p "$artifact_dir"
          set +e
          git status --porcelain > "$artifact_dir/git-status.txt"
          bash scripts/assert-production-ready.sh > "$artifact_dir/readiness.log" 2>&1
          readiness_exit=$?
          printf 'readiness_exit=%s\n' "$readiness_exit" > "$artifact_dir/exit-codes.txt"
          exit 0

      - name: Upload exact readiness diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-exact-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/privacy-readiness-diagnostics
          if-no-files-found: error
          retention-days: 7
