name: Privacy Readiness Assertion Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@v7
        with:
          ref: fix/protected-noindex-main-d34-20260719

      - name: Capture exact readiness assertion output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          bash scripts/assert-production-ready.sh > diagnostics/readiness.log 2>&1
          readiness_exit=$?
          git status --porcelain > diagnostics/git-status.txt
          printf 'readiness_exit=%s\n' "$readiness_exit" > diagnostics/exit-codes.txt
          exit 0

      - name: Upload exact readiness diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-readiness-diagnostics-${{ github.sha }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
