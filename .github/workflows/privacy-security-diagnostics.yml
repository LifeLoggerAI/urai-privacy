name: Refresh Privacy Production Dependency Locks

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-locks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/protected-noindex-main-d34-20260719
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Apply non-breaking production audit fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only --omit=dev --ignore-scripts
          npm --prefix functions audit fix --package-lock-only --omit=dev --ignore-scripts
          npm ci --ignore-scripts
          npm ci --prefix functions --ignore-scripts
          npm audit --audit-level=critical --omit=dev
          npm --prefix functions audit --audit-level=critical --omit=dev

      - name: Commit exact lock refresh
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json functions/package-lock.json; then
            echo 'Production dependency locks already satisfy the critical gate.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json functions/package-lock.json
          git commit -m 'build(privacy): refresh critical dependency locks'
          git push origin HEAD:fix/protected-noindex-main-d34-20260719
