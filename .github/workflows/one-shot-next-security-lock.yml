name: One-shot Next security lock

on:
  push:
    branches:
      - fix/next-16-3-4-security-20260911
    paths:
      - .github/workflows/one-shot-next-security-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/next-16-3-4-security-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate patched dependency lock
        run: npm install --package-lock-only next@16.3.4 eslint-config-next@16.3.4
      - name: Enforce critical audit
        run: npm audit --audit-level=critical
      - name: Commit generated lock and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-next-security-lock.yml
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "security: upgrade Next.js to patched 16.3.4"
          git push origin HEAD:fix/next-16-3-4-security-20260911
