name: R30 current-source Jobs to Privacy denial emulator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r30-current-jobs-privacy-denial-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  r30-native-denial:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 258 || startsWith(github.head_ref, 'review/chalk-r31-') || startsWith(github.head_ref, 'review/chalk-r1012-native-denial-ci-trigger-') || startsWith(github.head_ref, 'review/chalk-r1016-jobs-r1015-native-denial-') || startsWith(github.head_ref, 'review/chalk-r1020-jobs-r1017-native-denial-') || startsWith(github.head_ref, 'review/chalk-r1022-jobs-r1020-native-denial-') || startsWith(github.head_ref, 'review/chalk-r1026-jobs-r1024-native-denial-') || startsWith(github.head_ref, 'review/chalk-r1027-jobs-r1026-native-denial-') || startsWith(github.head_ref, 'review/chalk-r1032-jobs-r1031-native-denial-') || startsWith(github.head_ref, 'review/chalk-r1035-jobs419-native-denial-') || startsWith(github.head_ref, 'review/chalk-r1037-jobs420-native-denial-') || startsWith(github.head_ref, 'review/chalk-r1048-privacy-jobs-r1047-') || startsWith(github.head_ref, 'review/chalk-r1052-privacy-jobs-r1051-') || startsWith(github.head_ref, 'review/chalk-r1054-privacy-jobs-r1053-') || startsWith(github.head_ref, 'review/chalk-r1064-privacy-jobs448-') || startsWith(github.head_ref, 'review/chalk-r1067-privacy-jobs449-') || startsWith(github.head_ref, 'review/chalk-r1078-privacy-jobs456-') || startsWith(github.head_ref, 'review/chalk-r1083-privacy-jobs460-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_PRIVACY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      URAI_EXPECTED_PRIVACY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      URAI_JOBS_SOURCE_DIR: /tmp/urai-jobs-r1059
    steps:
      - name: Checkout exact Privacy candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_PRIVACY_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Require read-only cross-repository checkout credential
        shell: bash
        env:
          R30_JOBS_READ_TOKEN: ${{ secrets.URAI_READONLY_REPO_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$R30_JOBS_READ_TOKEN" || {
            echo "Missing URAI_READONLY_REPO_TOKEN; provide a GitHub credential restricted to contents:read on LifeLoggerAI/urai-jobs."
            exit 1
          }

      - name: Checkout exact Jobs R1083 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LifeLoggerAI/urai-jobs
          ref: 73021d2a06a3d8afe4f64a0ca1c5c1c49dc71683
          token: ${{ secrets.URAI_READONLY_REPO_TOKEN }}
          path: jobs-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.0'

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare credential-free pinned execution
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_PRIVACY_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git -C jobs-source rev-parse HEAD)" = "73021d2a06a3d8afe4f64a0ca1c5c1c49dc71683"
          test -z "$(git -C jobs-source status --porcelain --untracked-files=all)"
          mv "$GITHUB_WORKSPACE/jobs-source" /tmp/urai-jobs-r1059
          node --version
          npm --version
          npm install --global pnpm@8.15.9
          test "$(pnpm --version)" = "8.15.9"
          java -version
          java -version 2>&1 | grep -Eq 'version "21\.'
          mkdir -p "$RUNNER_TEMP/r30-evidence"

      - name: Execute exact-source R30 native denial acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run-r30-native-jobs-privacy-acceptance.sh 2>&1 | tee "$RUNNER_TEMP/r30-evidence/native-denial.log"

      - name: Upload R30 emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r30-current-jobs-privacy-denial-${{ env.TARGET_PRIVACY_SHA }}
          path: ${{ runner.temp }}/r30-evidence
          if-no-files-found: warn
          retention-days: 90
