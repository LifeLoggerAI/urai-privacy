name: Privacy dependency audit diagnostic

on:
  pull_request:
    branches:
      - audit/privacy-authz-p0-2026-07-06
    paths:
      - .github/workflows/dependency-audit-diagnostic.yml
  push:
    branches:
      - reconcile/deletion-orchestration-into-82-20260714
    paths:
      - .github/workflows/dependency-audit-diagnostic.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Capture root and Functions audits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          out="$RUNNER_TEMP/privacy-dependency-audit"
          mkdir -p "$out/root" "$out/functions"

          npm ci --ignore-scripts > "$out/root/install.log" 2>&1
          set +e
          npm audit --json > "$out/root/npm-audit.json" 2> "$out/root/npm-audit.stderr"
          root_status=$?
          set -e

          npm --prefix functions ci --ignore-scripts > "$out/functions/install.log" 2>&1
          set +e
          npm --prefix functions audit --json > "$out/functions/npm-audit.json" 2> "$out/functions/npm-audit.stderr"
          functions_status=$?
          set -e

          node - "$out" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const base = process.argv[2];
          function summarize(name) {
            const audit = JSON.parse(fs.readFileSync(path.join(base, name, 'npm-audit.json'), 'utf8'));
            return {
              metadata: audit.metadata,
              vulnerabilities: Object.entries(audit.vulnerabilities || {}).map(([pkg, value]) => ({
                package: pkg,
                severity: value.severity,
                direct: Boolean(value.isDirect),
                range: value.range,
                fixAvailable: value.fixAvailable,
                via: (value.via || []).map((item) => typeof item === 'string' ? item : {
                  source: item.source,
                  name: item.name,
                  severity: item.severity,
                  range: item.range,
                  title: item.title,
                }),
              })),
            };
          }
          fs.writeFileSync(path.join(base, 'summary.json'), JSON.stringify({
            exactHeadSha: process.env.TARGET_SHA,
            root: summarize('root'),
            functions: summarize('functions'),
            deployment: false,
            certification: false,
          }, null, 2));
          NODE
          printf 'root_audit_exit=%s\nfunctions_audit_exit=%s\nexact_head=%s\n' "$root_status" "$functions_status" "$TARGET_SHA" > "$out/status.txt"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-dependency-audit-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-dependency-audit
          if-no-files-found: error
          retention-days: 30
