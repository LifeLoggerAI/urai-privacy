name: Privacy package validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Scan for committed secrets
        run: python tools/check_secrets.py
      - name: Validate website
        run: python tools/check_website.py
      - name: Validate privacy package
        run: python tools/validate_privacy_package.py
