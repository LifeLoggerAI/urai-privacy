name: Privacy package validation

on:
  pull_request:
  push:
    branches:
      - main
      - add-policy-registry-enforcement

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependencies
        run: pip install -r requirements.txt
      - name: Validate privacy package
        run: python tools/validate_privacy_package.py
