name: Privacy package validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: privacy-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install validator dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Scan for committed secrets
        run: python tools/check_secrets.py

      - name: Validate website
        run: python tools/check_website.py

      - name: Validate privacy package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-diagnostics
          python tools/validate_privacy_package.py 2>&1 | tee artifacts/ci-diagnostics/privacy-package-validator.log

      - name: Upload privacy package diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-package-validator-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/ci-diagnostics/privacy-package-validator.log
          if-no-files-found: ignore

      - name: Restore and prove clean tree
        if: always()
        shell: bash
        run: |
          rm -rf artifacts
          test -z "$(git status --porcelain --untracked-files=all)"
