name: URAI Production Verify

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: urai-privacy-production-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Build, test, and QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Capture typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifacts/verification
          npm run typecheck --if-present 2>&1 | tee artifacts/verification/typecheck.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/verification/typecheck-exit-code.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture root tests
        id: tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test --if-present 2>&1 | tee artifacts/verification/root-tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/verification/root-tests-exit-code.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-source-verification-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/verification
          if-no-files-found: error
          retention-days: 365

      - name: Enforce typecheck and tests
        shell: bash
        run: |
          test "${{ steps.typecheck.outputs.status }}" = "0"
          test "${{ steps.tests.outputs.status }}" = "0"

      - name: Remove verification diagnostics
        if: always()
        run: rm -rf artifacts

      - name: Build
        run: npm run build --if-present

      - name: Run URAI QA
        run: npm run urai:qa --if-present

      - name: Prove final clean tree
        if: always()
        shell: bash
        run: |
          rm -rf artifacts
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
