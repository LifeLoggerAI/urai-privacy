name: Reconcile deletion orchestration into Privacy authority

on:
  push:
    branches:
      - reconcile/deletion-orchestration-into-82-20260714
    paths:
      - .github/workflows/reconcile-deletion-orchestration-into-privacy-authority.yml
  pull_request:
    branches:
      - audit/privacy-authz-p0-2026-07-06
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/reconcile-deletion-orchestration-into-privacy-authority.yml

permissions:
  contents: write

concurrency:
  group: reconcile-deletion-orchestration-into-privacy-82
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'LifeLoggerAI/urai-privacy' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/reconcile/deletion-orchestration-into-82-20260714') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'reconcile/deletion-orchestration-into-82-20260714'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTHORITY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      AUTHORITY_BRANCH: reconcile/deletion-orchestration-into-82-20260714
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.AUTHORITY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authority and fetch retained deletion source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORITY_SHA"
          test "$(git status --porcelain --untracked-files=all)" = ""
          git fetch --no-tags origin \
            +refs/heads/privacy/deletion-orchestration-p0-20260706:refs/remotes/origin/privacy/deletion-orchestration-p0-20260706

      - name: Merge clean deletion files and retain current shared authorities
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/privacy-reconciliation"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/privacy/deletion-orchestration-p0-20260706 \
            > "$RUNNER_TEMP/privacy-reconciliation/merge.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/privacy-reconciliation/merge-exit.txt"

          if [ "$status" -eq 0 ]; then
            printf 'mode=clean\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/privacy-reconciliation/conflicts.txt"
          cat > "$RUNNER_TEMP/privacy-reconciliation/expected-conflicts.txt" <<'EOF'
          app/privacy-center/consent/page.tsx
          firestore.rules
          functions/package.json
          src/lib/firebase-privacy-client.ts
          EOF
          sort -o "$RUNNER_TEMP/privacy-reconciliation/expected-conflicts.txt" "$RUNNER_TEMP/privacy-reconciliation/expected-conflicts.txt"
          if ! cmp -s "$RUNNER_TEMP/privacy-reconciliation/conflicts.txt" "$RUNNER_TEMP/privacy-reconciliation/expected-conflicts.txt"; then
            git merge --abort || true
            printf 'mode=unexpected\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            git checkout --ours -- "$path"
            git add "$path"
          done < "$RUNNER_TEMP/privacy-reconciliation/expected-conflicts.txt"
          git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/privacy-reconciliation/remaining-conflicts.txt"
          test ! -s "$RUNNER_TEMP/privacy-reconciliation/remaining-conflicts.txt"
          printf 'mode=partial\n' >> "$GITHUB_OUTPUT"

      - name: Upload reconciliation evidence
        if: steps.merge.outputs.mode != 'clean'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-deletion-reconciliation-${{ env.AUTHORITY_SHA }}
          path: ${{ runner.temp }}/privacy-reconciliation
          retention-days: 90
          if-no-files-found: error

      - name: Fail closed on unexpected conflicts
        if: steps.merge.outputs.mode == 'unexpected'
        shell: bash
        run: |
          echo 'Unexpected deletion-orchestration conflicts require path-by-path privacy review.'
          exit 1

      - name: Finalize bounded reconciliation
        if: steps.merge.outputs.mode == 'clean' || steps.merge.outputs.mode == 'partial'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-deletion-orchestration-into-privacy-authority.yml
          mkdir -p operations/receipts/privacy
          mode='${{ steps.merge.outputs.mode }}'
          cat > operations/receipts/privacy/deletion-orchestration-reconciliation-20260714.md <<EOF
          # Privacy deletion-orchestration reconciliation

          - Canonical privacy authority base: ff741bd52534ca60135bd1fa997f9ffd1e930f4b
          - Retained deletion source: eaada05c27822318dd6946189bea75af7aefa9e3
          - Trigger SHA: $AUTHORITY_SHA
          - Reconciliation mode: $mode
          - Live privacy operation: false
          - Firebase deployment: false
          - Credential mutation: false
          - Production-data mutation: false

          The clean, unique deletion-orchestration files were transferred into the canonical Privacy authority.

          When reconciliation mode is partial, canonical #82 versions were deliberately retained for these four sensitive shared paths pending focused privacy/security review:

          - app/privacy-center/consent/page.tsx
          - firestore.rules
          - functions/package.json
          - src/lib/firebase-privacy-client.ts

          This receipt does not claim those paths are reconciled. Exact-head unit/emulator/security validation, downstream adapter review, protected staging, legal/privacy review and rollback proof remain required before consumption into PR #82.
          EOF
          git add operations/receipts/privacy/deletion-orchestration-reconciliation-20260714.md
          git diff --cached --check

      - name: Commit bounded reconciliation and push
        if: steps.merge.outputs.mode == 'clean' || steps.merge.outputs.mode == 'partial'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Reconcile non-overlapping deletion orchestration into Privacy authority"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:$AUTHORITY_BRANCH
