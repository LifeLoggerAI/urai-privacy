name: Pin Privacy Firebase CLI

on:
  pull_request:

permissions:
  contents: write

jobs:
  pin-cli:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/protected-noindex-main-d34-20260719
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Pin Firebase CLI and refresh lock authority
        shell: bash
        run: |
          npm install --save-dev --save-exact firebase-tools@15.24.0 --ignore-scripts
          node -e "const p=require('./package.json'); if (p.devDependencies?.['firebase-tools'] !== '15.24.0') process.exit(1)"
          npm ci --ignore-scripts
          npx firebase --version | grep '^15\.24\.0$'

      - name: Commit exact dependency update
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Firebase CLI dependency is already pinned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build(privacy): pin Firebase CLI for emulator gates'
          git push origin HEAD:fix/protected-noindex-main-d34-20260719
