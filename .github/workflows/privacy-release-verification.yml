name: URAI Privacy Release Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_live_auth_proof:
        description: "Require authenticated live workflow proof artifact"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: privacy-release-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  URAI_PRIVACY_REQUIRE_AUTH_LIVE_PROOF: ${{ github.event.inputs.require_live_auth_proof || '0' }}

jobs:
  release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-diagnostics
          npm run test:unit 2>&1 | tee artifacts/ci-diagnostics/privacy-unit-tests.log

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-unit-tests-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/ci-diagnostics/privacy-unit-tests.log
          if-no-files-found: ignore
          retention-days: 365

      - name: Remove unit-test diagnostics
        if: always()
        run: rm -rf artifacts

      - name: Static rules validation
        run: npm run test:rules:static

      - name: Route smoke
        run: npm run test:e2e

      - name: Privacy adoption audit
        run: npm run audit:privacy

      - name: Tier-One privacy audit
        run: npm run audit:tier-one

      - name: Build app
        run: npm run build

      - name: Build functions
        run: npm --prefix functions run build

      - name: Typecheck functions
        run: npm --prefix functions run typecheck

      - name: Check Java
        run: npm run check:java

      - name: Emulator-backed tests
        run: npm run test:emulators

      - name: Security gate
        run: npm run security:gate

      - name: Production readiness assertions
        run: bash scripts/assert-production-ready.sh

      - name: Authenticated live proof gate
        run: npm run test:live-auth-proof

      - name: Final clean-tree proof
        if: always()
        shell: bash
        run: |
          rm -rf artifacts
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
