name: Regenerate dependency locks for exact repair branch
on:
  push:
    branches:
      - repair/export-attempt-authority-20261007
    paths:
      - package.json
      - functions/package.json

permissions:
  contents: write

concurrency:
  group: urai-privacy-lock-regeneration
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/export-attempt-authority-20261007
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20.19.5'
      - name: Regenerate exact lockfiles
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix functions install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
      - name: Commit generated locks
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json functions/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "urai-release-automation"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json
          git commit -m "Regenerate privacy dependency locks"
          git push origin HEAD:repair/export-attempt-authority-20261007
