name: One-shot dependency lock refresh

on:
  push:
    branches:
      - forensic/next-16-3-6-lock-repair

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.head_commit.message != 'chore: refresh generated dependency locks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forensic/next-16-3-6-lock-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - name: Refresh root lockfile
        run: npm audit fix --package-lock-only --omit=dev
        continue-on-error: true
      - name: Refresh Functions lockfile
        run: npm --prefix functions audit fix --package-lock-only --omit=dev
        continue-on-error: true
      - name: Commit generated lockfiles only
        run: |
          set -euo pipefail
          git diff -- package-lock.json functions/package-lock.json > /tmp/lockfile.patch
          if test ! -s /tmp/lockfile.patch; then
            echo "No generated lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json
          git commit -m "chore: refresh generated dependency locks"
          git push origin HEAD:forensic/next-16-3-6-lock-repair
