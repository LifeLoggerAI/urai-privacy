name: Privacy Package Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Capture package validator output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pip install -r requirements.txt > diagnostics/python-install.log 2>&1
          install_code=$?
          python tools/validate_privacy_package.py > diagnostics/privacy-package.log 2>&1
          package_code=$?
          printf 'install_exit=%s\npackage_exit=%s\n' "$install_code" "$package_code" > diagnostics/exit-codes.txt
          exit 0

      - name: Upload exact package diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-package-diagnostics-${{ github.sha }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
