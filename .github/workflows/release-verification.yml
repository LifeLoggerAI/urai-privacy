name: Release Verification

on:
  push:
    branches:
      - main
      - harden-release-verification
  pull_request:

permissions:
  contents: read

concurrency:
  group: urai-privacy-release-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@7a445ee88d4e23b52c33cdd4ac2c44f171c3c5bb
        with:
          distribution: temurin
          java-version: '21'

      - name: Full release verification
        run: npm run verify:release

      - name: Prove final clean head
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
