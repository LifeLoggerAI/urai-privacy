name: Release Verification

on:
  push:
    branches:
      - main
      - harden-release-verification
  pull_request:

permissions:
  contents: read

concurrency:
  group: privacy-release-verification-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Capture full release verification
        id: release
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifacts/release-verification
          npm run verify:release 2>&1 | tee artifacts/release-verification/full-release-verification.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/release-verification/exit-code.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload full release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-full-release-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: artifacts/release-verification
          if-no-files-found: error
          retention-days: 365

      - name: Enforce full release verification
        shell: bash
        run: test "${{ steps.release.outputs.status }}" = "0"

      - name: Restore and prove clean tree
        if: always()
        shell: bash
        run: |
          rm -rf artifacts
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
