name: Release Verification

on:
  push:
    branches:
      - main
      - harden-release-verification
  pull_request:

jobs:
  verify-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Static rules validation
        run: npm run test:rules:static

      - name: Build
        run: npm run build

      - name: Security gate
        run: npm run security:gate
