name: Website validation

on:
  pull_request:
    paths:
      - 'website/**'
      - 'tools/check_website.py'
      - '.github/workflows/website.yml'
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'tools/check_website.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-website-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/privacy-website-validation"
          python tools/check_website.py 2>&1 | tee "$RUNNER_TEMP/privacy-website-validation/website-validation.log"

      - name: Upload website validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privacy-website-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-website-validation
          if-no-files-found: error
          retention-days: 90

      - name: Prove final clean head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
