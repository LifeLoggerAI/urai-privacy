name: Apply verified dependency remediation locks

on:
  push:
    branches:
      - audit/privacy-authz-p0-2026-07-06
    paths:
      - .github/workflows/apply-dependency-remediation-locks.yml

permissions:
  contents: write

concurrency:
  group: urai-privacy-apply-remediation-locks
  cancel-in-progress: false

jobs:
  apply-locks:
    name: Regenerate, verify, and commit exact inspected lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Regenerate non-breaking remediation locks
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --omit=dev
          npm --prefix functions audit fix --package-lock-only --omit=dev
          set -euo pipefail
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = 'fe0c44607451cbd0ae67fdd907fc76afab0321d8265780e6faf8e8e7dbbcfa4a'
          test "$(sha256sum functions/package-lock.json | cut -d' ' -f1)" = '52d3ce9360822c9af0253d8c3754136826b2c1b099a0949bc257ff570bf705c6'

      - name: Install exact remediated locks
        run: |
          npm ci
          npm --prefix functions ci

      - name: Prove high and critical advisories are zero
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/privacy-lock-remediation"
          npm audit --omit=dev --json > "$RUNNER_TEMP/privacy-lock-remediation/root-after.json"
          npm --prefix functions audit --omit=dev --json > "$RUNNER_TEMP/privacy-lock-remediation/functions-after.json"
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          for (const scope of ['root', 'functions']) {
            const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/privacy-lock-remediation/${scope}-after.json`, 'utf8'));
            const counts = report?.metadata?.vulnerabilities ?? {};
            if (Number(counts.high ?? 0) !== 0 || Number(counts.critical ?? 0) !== 0) {
              throw new Error(`${scope} still has high/critical production advisories`);
            }
          }
          NODE

      - name: Verify source contract under remediated locks
        run: |
          npm run typecheck
          npm run test:unit
          npm run test:rules:static
          npm --prefix functions run typecheck
          npm run build
          npm --prefix functions run build

      - name: Prove mutation is confined to two lockfiles
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' functions/package-lock.json package-lock.json | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Write and upload apply receipt
        shell: bash
        run: |
          evidence_dir="$RUNNER_TEMP/privacy-lock-remediation"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "source_head=$GITHUB_SHA"
            echo "root_lock_sha256=$(sha256sum package-lock.json | cut -d' ' -f1)"
            echo "functions_lock_sha256=$(sha256sum functions/package-lock.json | cut -d' ' -f1)"
            echo "changed_paths=package-lock.json,functions/package-lock.json"
            echo "deployment=false"
            echo "cloud_credentials=false"
            echo "production_data_mutation=false"
          } > "$evidence_dir/apply-receipt.env"
          git diff -- package-lock.json functions/package-lock.json > "$evidence_dir/lockfile.patch"

      - name: Upload apply evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-privacy-applied-remediation-locks-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-lock-remediation
          if-no-files-found: error
          retention-days: 365

      - name: Commit exact remediated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json functions/package-lock.json
          git commit -m 'Remediate Privacy high-severity dependency advisories'
          git push origin HEAD:audit/privacy-authz-p0-2026-07-06
