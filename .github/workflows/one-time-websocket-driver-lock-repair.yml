name: One-time Privacy websocket-driver lock repair

on:
  push:
    branches:
      - reconcile/deletion-orchestration-into-82-20260714
    paths:
      - .github/workflows/one-time-websocket-driver-lock-repair.yml

permissions:
  contents: write

concurrency:
  group: one-time-privacy-websocket-driver-lock-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: a0fe814568f09312eeb5ad4d5a7cab4992deb3a5
      BRANCH: reconcile/deletion-orchestration-into-82-20260714
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-file bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/one-time-websocket-driver-lock-repair.yml"

      - name: Regenerate synchronized lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'overrides.websocket-driver=0.7.5'
          npm --prefix functions pkg set 'overrides.websocket-driver=0.7.5'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix functions install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=critical
          npm --prefix functions audit --omit=dev --audit-level=critical
          node -e "for (const p of ['package-lock.json','functions/package-lock.json']) { const l=require('./'+p); if (l.packages['node_modules/websocket-driver'].version !== '0.7.5') throw new Error(p+' not repaired'); }"

      - name: Commit bounded repair and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-websocket-driver-lock-repair.yml
          git add package.json package-lock.json functions/package.json functions/package-lock.json
          test -z "$(git diff --cached --name-only | grep -Ev '^(package.json|package-lock.json|functions/package.json|functions/package-lock.json|.github/workflows/one-time-websocket-driver-lock-repair.yml)$')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair websocket-driver critical advisory'
          git push origin "HEAD:$BRANCH"
