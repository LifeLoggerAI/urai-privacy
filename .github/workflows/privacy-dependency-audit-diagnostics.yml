name: Privacy Dependency Remediation Publisher

on:
  push:
    branches:
      - reconcile/deletion-orchestration-into-82-20260714
    paths:
      - .github/workflows/privacy-dependency-audit-diagnostics.yml
  pull_request:
    branches:
      - audit/privacy-authz-p0-2026-07-06
    paths:
      - .github/workflows/privacy-dependency-audit-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: privacy-dependency-remediation-publisher
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: reconcile/deletion-orchestration-into-82-20260714

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Prove exact clean and unchanged branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Materialize and verify zero-advisory dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set overrides.uuid=11.1.1
          (cd functions && npm pkg set overrides.uuid=11.1.1)
          npm install --package-lock-only --save-dev --save-exact \
            vitest@4.1.10 firebase-functions@6.6.0
          npm audit fix --package-lock-only
          (cd functions && npm audit fix --package-lock-only)
          npm ci
          npm test
          npm run typecheck
          (cd functions && npm ci && npm run typecheck)
          npm audit --audit-level=low
          (cd functions && npm audit --audit-level=low)

      - name: Commit only permanent package files and remove publisher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/privacy-dependency-audit-diagnostics.yml
          git add package.json package-lock.json functions/package.json functions/package-lock.json
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/privacy-dependency-audit-diagnostics.yml' \
            'functions/package-lock.json' \
            'functions/package.json' \
            'package-lock.json' \
            'package.json' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name "LifeLoggerAI release automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remediate Privacy dependency advisories"
          git push origin "HEAD:$TARGET_BRANCH"
