name: Privacy Dependency Audit Diagnostics

on:
  push:
    branches:
      - reconcile/deletion-orchestration-into-82-20260714
    paths:
      - .github/workflows/privacy-dependency-audit-diagnostics.yml
  pull_request:
    branches:
      - audit/privacy-authz-p0-2026-07-06
    paths:
      - .github/workflows/privacy-dependency-audit-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: privacy-dependency-audit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Generate non-breaking remediation candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/privacy-remediation/root" "$RUNNER_TEMP/privacy-remediation/functions"

          npm install --package-lock-only --save-dev --save-exact vitest@4.1.10
          set +e
          npm audit fix --package-lock-only > "$RUNNER_TEMP/privacy-remediation/root/audit-fix.log" 2>&1
          root_fix_status=$?
          (cd functions && npm audit fix --package-lock-only > "$RUNNER_TEMP/privacy-remediation/functions/audit-fix.log" 2>&1)
          functions_fix_status=$?
          set -e

          npm ci
          npm test > "$RUNNER_TEMP/privacy-remediation/root/test.log" 2>&1
          npm run typecheck > "$RUNNER_TEMP/privacy-remediation/root/typecheck.log" 2>&1
          (cd functions && npm ci && npm run typecheck > "$RUNNER_TEMP/privacy-remediation/functions/typecheck.log" 2>&1)

          set +e
          npm audit --json > "$RUNNER_TEMP/privacy-remediation/root/audit-after.json"
          root_audit_status=$?
          (cd functions && npm audit --json > "$RUNNER_TEMP/privacy-remediation/functions/audit-after.json")
          functions_audit_status=$?
          set -e

          cp package.json package-lock.json "$RUNNER_TEMP/privacy-remediation/root/"
          cp functions/package.json functions/package-lock.json "$RUNNER_TEMP/privacy-remediation/functions/"
          printf 'target_sha=%s\nnode=%s\nnpm=%s\nroot_fix_status=%s\nfunctions_fix_status=%s\nroot_audit_status=%s\nfunctions_audit_status=%s\nforced_updates=false\n' \
            "$TARGET_SHA" "$(node --version)" "$(npm --version)" \
            "$root_fix_status" "$functions_fix_status" "$root_audit_status" "$functions_audit_status" \
            > "$RUNNER_TEMP/privacy-remediation/identity.txt"

      - name: Upload remediation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-dependency-remediation-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-remediation
          if-no-files-found: error
          retention-days: 30
