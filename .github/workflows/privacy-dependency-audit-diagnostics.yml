name: Privacy Dependency Audit Diagnostics

on:
  push:
    branches:
      - reconcile/deletion-orchestration-into-82-20260714
    paths:
      - .github/workflows/privacy-dependency-audit-diagnostics.yml
  pull_request:
    branches:
      - audit/privacy-authz-p0-2026-07-06
    paths:
      - .github/workflows/privacy-dependency-audit-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: privacy-dependency-audit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Capture root and Functions audit reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/privacy-audit"
          set +e
          npm audit --json > "$RUNNER_TEMP/privacy-audit/root-audit.json"
          root_status=$?
          (cd functions && npm audit --json > "$RUNNER_TEMP/privacy-audit/functions-audit.json")
          functions_status=$?
          set -e
          printf 'target_sha=%s\nroot_status=%s\nfunctions_status=%s\nnode=%s\nnpm=%s\n' \
            "$TARGET_SHA" "$root_status" "$functions_status" "$(node --version)" "$(npm --version)" \
            > "$RUNNER_TEMP/privacy-audit/identity.txt"

      - name: Upload audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: privacy-dependency-audit-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-audit
          if-no-files-found: error
          retention-days: 30
