name: URAI Privacy Release Verification

on:
  push:
    branches:
      - main
      - harden-release-verification
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-privacy-release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    name: Verify release gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show runtimes
        run: |
          node --version
          npm --version
          java -version

      - name: Run full release verifier
        run: bash scripts/verify-release.sh
