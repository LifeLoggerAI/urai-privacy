name: URAI Privacy Release Verification

on:
  push:
    branches:
      - main
      - harden-release-verification
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-privacy-release-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-release:
    name: Verify release gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Show runtimes
        run: |
          node --version
          npm --version
          java -version

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Capture full release verifier
        id: release
        shell: bash
        run: |
          set +e
          set -o pipefail
          log_dir="$RUNNER_TEMP/privacy-release-verify"
          rm -rf -- "$log_dir"
          mkdir -p -- "$log_dir"
          npm run verify:release 2>&1 | tee "$log_dir/full-release-verifier.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$log_dir/exit-code.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload release verifier diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-release-verify-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/privacy-release-verify
          if-no-files-found: error
          retention-days: 365

      - name: Enforce full release verifier
        shell: bash
        run: test "${{ steps.release.outputs.status }}" = "0"

      - name: Prove final clean tree
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
