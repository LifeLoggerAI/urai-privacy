name: Consent Export and Deletion Branch Validation

on:
  pull_request:
  push:
    branches:
      - privacy/consent-decision-p0-20260706
      - privacy/deletion-orchestration-p0-20260706
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-privacy-consent-export-deletion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Lint
        run: npm run lint
      - name: Root typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Static rules validation
        run: npm run test:rules:static
      - name: Complete export contract
        run: npm run test:export:contract
      - name: Deletion orchestration contract
        run: npm run test:deletion:contract
      - name: Route smoke
        run: npm run test:e2e
      - name: Functions typecheck
        run: npm --prefix functions run typecheck
      - name: Functions build
        run: npm --prefix functions run build
      - name: Next production build
        run: npm run build
      - name: Security gate
        run: npm run security:gate

  emulator-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Run Firebase emulator tests
        env:
          URAI_RELEASE_VERIFY: '1'
        run: npm run test:emulators
