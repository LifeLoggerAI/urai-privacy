name: Consent Export and Deletion Branch Validation

on:
  pull_request:
  push:
    branches:
      - privacy/consent-decision-p0-20260706
      - privacy/deletion-orchestration-p0-20260706
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-privacy-consent-export-deletion-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repository-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Lint
        run: npm run lint
      - name: Root typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Static rules validation
        run: npm run test:rules:static
      - name: Complete export contract
        run: npm run test:export:contract
      - name: Deletion orchestration contract
        run: npm run test:deletion:contract
      - name: Route smoke
        run: npm run test:e2e
      - name: Functions typecheck
        run: npm --prefix functions run typecheck
      - name: Functions build
        run: npm --prefix functions run build
      - name: Next production build
        run: npm run build
      - name: Security gate
        run: npm run security:gate

  emulator-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Run Firebase emulator tests
        env:
          URAI_RELEASE_VERIFY: '1'
        run: npm run test:emulators
