name: Consent Export and Deletion Branch Validation

on:
  pull_request:
  push:
    branches:
      - privacy/consent-decision-p0-20260706
      - privacy/deletion-orchestration-p0-20260706
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-privacy-consent-export-deletion-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repository-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Lint
        run: npm run lint
      - name: Root typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Static rules validation
        run: npm run test:rules:static
      - name: Complete export contract
        run: npm run test:export:contract
      - name: Deletion orchestration contract
        run: npm run test:deletion:contract
      - name: Route smoke
        run: npm run test:e2e
      - name: Functions typecheck
        run: npm --prefix functions run typecheck
      - name: Functions build
        run: npm --prefix functions run build
      - name: Next production build
        run: npm run build
      - name: Security gate
        run: npm run security:gate

  emulator-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install root dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Verify emulator-load assertion
        run: node --test scripts/functions-emulator-loaded.cases.mjs
      - name: Run Firebase emulator tests
        env:
          URAI_RELEASE_VERIFY: '1'
        run: npm run test:emulators
