feature: journal-insight
repo: sample-urai-product-app
owner: product-app-privacy
privacyGovernanceVersion: 0.1.0-draft
status: draft
lastReviewed: 2026-05-07

summary:
  purpose: Generate user-facing journal insight summaries from consented journal and context signals.
  userBenefit: Helps users understand emotional patterns while keeping sensitive inference explicit and explainable.
  releaseTarget: product-app

dataProcessing:
  collectedFields:
    - name: location_context_summary
      dataClass: L3
      source: device
      purpose: provide user-facing context summaries
      consentTier: C3
      retentionClass: R2
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: journal_sentiment
      dataClass: L4
      sourceFields:
        - location_context_summary
      purpose: generate user-facing emotional insight from user-provided journal context
      consentTier: C4
      retentionClass: R3
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes: []

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: privacy-governance
  decision: pending
  notes: Example for user-facing app features with sensitive inference. Production repos must prove C4 consent, revocation, deletion, export, and explanation flows.
