repo: sample-urai-product-app
privacyGovernanceVersion: 0.1.0-draft
owner: product-app-privacy
lastReviewed: 2026-05-07

fields:
  - name: journal_sentiment
    collectionOrTable: user_journal_insights
    source: model
    dataClass: L4
    purpose: generate user-facing emotional insight from user-provided journal context
    consentTier: C4
    retentionClass: R3
    exportable: true
    deletable: true
    monetizable: false
    aiTrainingAllowed: false
    adminAccessible: false
    auditRequired: true
    notes: Sensitive inference. Requires separate C4 consent and explainability.

  - name: location_context_summary
    collectionOrTable: user_context_events
    source: device
    dataClass: L3
    purpose: provide user-facing context summaries
    consentTier: C3
    retentionClass: R2
    exportable: true
    deletable: true
    monetizable: false
    aiTrainingAllowed: false
    adminAccessible: false
    auditRequired: true
    notes: Precise location must not be collected without explicit user-facing purpose and consent.
