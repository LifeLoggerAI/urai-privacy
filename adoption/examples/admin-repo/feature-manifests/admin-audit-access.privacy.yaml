feature: admin-audit-access
repo: sample-urai-admin
owner: admin-platform
privacyGovernanceVersion: 0.1.0-draft
status: draft
lastReviewed: 2026-05-07

summary:
  purpose: Record privileged admin access events for auditability and incident response.
  userBenefit: Protects users from unreviewed or unexplained privileged access.
  releaseTarget: admin-tooling

dataProcessing:
  collectedFields:
    - name: admin_actor_id
      dataClass: L1
      source: admin
      purpose: identify privileged actor for auditability
      consentTier: C0
      retentionClass: R4
      exportable: false
      deletable: false
      auditRequired: true
    - name: target_user_reference
      dataClass: L3
      source: system
      purpose: record which user record was accessed
      consentTier: C3
      retentionClass: R4
      exportable: true
      deletable: false
      auditRequired: true
  derivedFields: []

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: true
  roles:
    - privacy-admin
    - security-incident-lead
  auditEventTypes:
    - admin.user_data_accessed
    - admin.break_glass_invoked

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: privacy-governance
  decision: pending
  notes: Example for admin tooling. Production repos must define least-privilege roles and break-glass controls.
