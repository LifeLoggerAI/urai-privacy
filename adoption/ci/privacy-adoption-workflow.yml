name: Privacy adoption validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-privacy-adoption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install PyYAML>=6.0.1 jsonschema>=4.21.1
      - name: Validate privacy adoption folder
        run: python tools/validate_repo_privacy.py
