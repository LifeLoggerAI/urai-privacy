feature: mood-weather-report
repo: UrAiProd
owner: product-privacy
privacyGovernanceVersion: 0.1.0-draft
status: approved
lastReviewed: 2026-05-06

summary:
  purpose: Generate a user-facing mood weather summary from consented behavioral and memory signals.
  userBenefit: Helps the user understand emotional and cognitive rhythm shifts.
  releaseTarget: v1

dataProcessing:
  collectedFields:
    - name: app_interaction_rhythm
      dataClass: L2
      source: device
      purpose: support mood weather context
      consentTier: C2
      retentionClass: R1
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: mood_weather_state
      dataClass: L4
      sourceFields:
        - app_interaction_rhythm
      purpose: generate sensitive user-facing mood inference
      consentTier: C4
      retentionClass: R3
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes: []

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: privacy-governance
  decision: approved
  notes: Valid example for C2 collection and C4 sensitive inference.
