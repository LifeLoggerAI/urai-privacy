name: Privacy adoption check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  privacy-adoption:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required privacy files
        shell: bash
        run: |
          set -euo pipefail
          test -f privacy/PRIVACY_VERSION.md
          test -f privacy/adoption-report.md
          if [ ! -f privacy/data-inventory.yaml ] && [ ! -f privacy/data-inventory.md ]; then
            echo "Missing privacy data inventory"
            exit 1
          fi
          echo "Required privacy adoption files exist."

      - name: Require blocked or approved launch decision
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eiq "Status: (blocked|draft|approved|approved_with_conditions)" privacy/adoption-report.md; then
            echo "privacy/adoption-report.md must include an explicit launch decision status."
            exit 1
          fi
          echo "Launch decision status found."
