version: 0.1.0-draft
classes:
  R0:
    name: Ephemeral
    defaultDuration: PT24H
    description: Temporary buffers and short-lived processing artifacts.
  R1:
    name: Session / operational
    defaultDuration: P30D
    description: Operational logs, queues, temporary analytics, and reliability data.
  R2:
    name: User memory
    defaultDuration: until_user_deletes_or_account_closes
    description: User-approved memories, personal timelines, and records the user expects to keep.
  R3:
    name: Derived insight
    defaultDuration: P12M
    description: User-facing summaries and model-derived insights.
  R4:
    name: Consent and audit evidence
    defaultDuration: P7Y
    deletionBehavior: retain_minimal_evidence_where_lawful
    description: Consent events, privacy request records, and audit evidence.
  R5:
    name: De-identified aggregate
    defaultDuration: indefinite_if_risk_controlled
    reidentificationReviewRequired: true
    description: Cohort-level aggregate records.
  R6:
    name: Restricted biometric
    defaultDuration: P90D
    biometricDeletionRequired: true
    description: Voiceprints, face embeddings, biometric templates, and identity vectors.
